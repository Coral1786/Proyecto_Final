<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INGEARQ | Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="estilos_interno.css" />
  </head>
  <body class="dashboard-body">
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <div class="brand-box">
            <div class="brand-circle">I</div>
            <div>
              <h1>INGEARQ</h1>
              <p>Arte y arquitectura</p>
            </div>
          </div>

          <nav class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="product_manager.html">Inventario</a>
            <a href="sale_register.html">Ventas</a>
            <a href="sales_details.html">Comprobantes</a>
            <a href="cash_details.html">Caja</a>
            <a class="active" href="user_manager.html">Usuarios</a>
          </nav>
        </div>

        <button id="logoutBtn" class="logout-btn" type="button">Cerrar sesión</button>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Administración</p>
            <h2>Gestión de usuarios</h2>
          </div>
          <div class="topbar-actions">
            <span class="user-pill">Administrador</span>
            <button id="newUserBtn" class="primary-btn" type="button">+ Nuevo usuario</button>
            <a class="ghost-btn inline-link" href="register.html">Página de registro</a>
          </div>
        </header>

        <section class="panel-card product-layout">
          <div class="card-header compact">
            <h3>Usuarios registrados</h3>
            <div class="toolbar-inline">
              <input id="userSearch" type="search" placeholder="Buscar usuario" aria-label="Buscar usuario" />
            </div>
          </div>

          <div class="table-shell">
            <table class="data-table">
              <thead>
                <tr>
                  <th>DNI</th>
                  <th>Nombre</th>
                  <th>Usuario</th>
                  <th>Perfil</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="userModal" class="product-modal hidden" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
      <form id="userForm" class="product-modal-card">
        <div class="card-header compact">
          <h3 id="userModalTitle">Nuevo usuario</h3>
          <button id="closeUserModal" class="ghost-btn" type="button" aria-label="Cerrar">Cerrar</button>
        </div>
        <div class="form-grid">
          <div class="field-group"><label for="userDni">DNI</label><input id="userDni" inputmode="numeric" maxlength="8" required /></div>
          <div class="field-group"><label for="userNames">Nombres</label><input id="userNames" maxlength="100" required /></div>
          <div class="field-group"><label for="userSurnames">Apellidos</label><input id="userSurnames" maxlength="100" required /></div>
          <div class="field-group"><label for="userUsername">Usuario</label><input id="userUsername" maxlength="50" required /></div>
          <div class="field-group"><label for="userPassword">Clave</label><input id="userPassword" type="password" maxlength="72" autocomplete="new-password" /></div>
          <div class="field-group">
            <label for="userProfile">Perfil</label>
            <select id="userProfile"><option value="cliente">Cliente</option><option value="administrador">Administrador</option></select>
          </div>
          <div class="field-group">
            <label for="userStatus">Estado</label>
            <select id="userStatus"><option value="activo">Activo</option><option value="inactivo">Inactivo</option></select>
          </div>
        </div>
        <p id="userFormError" class="error-message hidden" role="alert"></p>
        <div class="submit-row"><button class="primary-btn" type="submit">Guardar usuario</button></div>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="api-client.js"></script>
    <script>
      if (localStorage.getItem("ingearqLoggedIn") !== "true" || localStorage.getItem("ingearqRole") !== "admin") {
        window.location.href = "index.html";
      }
      requireServerSession();

      const userTableBody = document.getElementById("userTableBody");
      const userSearch = document.getElementById("userSearch");
      const userModal = document.getElementById("userModal");
      const userForm = document.getElementById("userForm");
      const userFormError = document.getElementById("userFormError");
      let users = [];
      let editingUser = null;

      function renderUsers() {
        const term = userSearch.value.trim().toLowerCase();
        const visible = users.filter((user) =>
          `${user.dni} ${user.names} ${user.surnames} ${user.username}`.toLowerCase().includes(term));
        userTableBody.innerHTML = visible.map((user) => {
          const active = user.status === "activo";
          return `<tr>
            <td>${escapeHtml(user.dni)}</td>
            <td>${escapeHtml(user.names)} ${escapeHtml(user.surnames)}</td>
            <td>${escapeHtml(user.username)}</td>
            <td>${user.profile === "administrador" ? "Administrador" : "Cliente"}</td>
            <td><span class="status-badge ${active ? "success" : "danger"}">${active ? "Activo" : "Dado de baja"}</span></td>
            <td class="row-actions">
              <button class="ghost-btn edit-user" type="button" data-id="${user.id}">Editar</button>
              <button class="danger-btn toggle-user" type="button" data-id="${user.id}">${active ? "Dar de baja" : "Reactivar"}</button>
            </td>
          </tr>`;
        }).join("");
      }

      async function refreshUsers() {
        users = await apiRequest("/api/usuarios");
        renderUsers();
      }

      function openUserForm(user) {
        editingUser = user || null;
        document.getElementById("userModalTitle").textContent = user ? "Editar usuario" : "Nuevo usuario";
        document.getElementById("userDni").value = user?.dni || "";
        document.getElementById("userNames").value = user?.names || "";
        document.getElementById("userSurnames").value = user?.surnames || "";
        document.getElementById("userUsername").value = user?.username || "";
        document.getElementById("userPassword").value = "";
        document.getElementById("userPassword").placeholder = user ? "Dejar vacío para conservar" : "Mínimo 8 caracteres";
        document.getElementById("userProfile").value = user?.profile || "cliente";
        document.getElementById("userStatus").value = user?.status || "activo";
        userFormError.classList.add("hidden");
        userModal.classList.remove("hidden");
        document.getElementById("userDni").focus();
      }

      function closeUserForm() {
        userModal.classList.add("hidden");
        editingUser = null;
      }

      document.getElementById("newUserBtn").addEventListener("click", () => openUserForm());
      document.getElementById("closeUserModal").addEventListener("click", closeUserForm);
      userModal.addEventListener("click", (event) => {
        if (event.target === userModal) closeUserForm();
      });
      userSearch.addEventListener("input", renderUsers);

      userForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const data = {
          dni: document.getElementById("userDni").value.trim(),
          names: document.getElementById("userNames").value.trim(),
          surnames: document.getElementById("userSurnames").value.trim(),
          username: document.getElementById("userUsername").value.trim(),
          password: document.getElementById("userPassword").value,
          profile: document.getElementById("userProfile").value,
          status: document.getElementById("userStatus").value
        };
        try {
          if (editingUser) {
            await apiRequest(`/api/usuarios/${editingUser.id}`, { method: "PUT", body: data });
          } else {
            await apiRequest("/api/usuarios", { method: "POST", body: data });
          }
          await refreshUsers();
          closeUserForm();
        } catch (error) {
          userFormError.textContent = error.message;
          userFormError.classList.remove("hidden");
        }
      });

      userTableBody.addEventListener("click", async function (event) {
        const button = event.target.closest("button");
        if (!button) return;
        const user = users.find((item) => item.id === Number(button.dataset.id));
        if (!user) return;

        if (button.classList.contains("edit-user")) {
          openUserForm(user);
        } else if (button.classList.contains("toggle-user")) {
          const active = user.status === "activo";
          if (!window.confirm(`¿Deseas ${active ? "dar de baja" : "reactivar"} a "${user.username}"?`)) return;
          try {
            if (active) {
              await apiRequest(`/api/usuarios/${user.id}`, { method: "DELETE" });
            } else {
              await apiRequest(`/api/usuarios/${user.id}`, { method: "PUT", body: { ...user, status: "activo" } });
            }
            await refreshUsers();
          } catch (error) {
            alert(error.message);
          }
        }
      });

      refreshUsers().catch((error) => alert(error.message));

      document.getElementById("logoutBtn").addEventListener("click", async function () {
        localStorage.removeItem("ingearqLoggedIn");
        localStorage.removeItem("ingearqRole");
        await apiRequest("/api/auth/logout", { method: "POST" }).catch(() => {});
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
