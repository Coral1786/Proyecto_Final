<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INGEARQ | Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body class="login-page">
    <div class="page-shell">
      <aside class="brand-panel">
        <div class="brand-badge">INGEARQ</div>
        <p class="eyebrow">Librería especializada</p>
        <h1>Crea tu cuenta para acceder al sistema.</h1>
      </aside>

      <main class="login-panel">
        <div class="login-card">
          <div class="logo-block">
            <div class="logo-mark">I</div>
            <div>
              <p class="kicker">Solo administradores</p>
              <h2>Registro</h2>
            </div>
          </div>

          <form id="registerForm" novalidate>
            <label for="dni">DNI</label>
            <input id="dni" inputmode="numeric" maxlength="8" placeholder="8 dígitos" required />

            <label for="names">Nombres</label>
            <input id="names" maxlength="100" required />

            <label for="surnames">Apellidos</label>
            <input id="surnames" maxlength="100" required />

            <label for="username">Usuario</label>
            <input id="username" maxlength="50" autocomplete="username" required />

            <label for="password">Clave</label>
            <input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />

            <label for="profile">Perfil</label>
            <select id="profile">
              <option value="vendedor">Vendedor</option>
              <option value="administrador">Administrador</option>
            </select>

            <label for="status">Estado</label>
            <select id="status">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>

            <p id="registerMessage" class="error-message" aria-live="polite"></p>
            <button type="submit">Registrarme</button>
          </form>

          <p class="register-link"><a href="dashboard.html">Volver al panel</a> · <a href="user_manager.html">Gestión de usuarios</a></p>
        </div>
      </main>
    </div>

    <script src="api-client.js"></script>
    <script>
      if (localStorage.getItem("ingearqLoggedIn") !== "true" || localStorage.getItem("ingearqRole") !== "admin") {
        window.location.replace("index.html?admin=1");
      } else {
        apiRequest("/api/auth/session")
          .then((result) => {
            if (result.user.role !== "admin") window.location.replace("index.html?admin=1");
          })
          .catch(() => window.location.replace("index.html?admin=1"));
      }
      const form = document.getElementById("registerForm");
      const message = document.getElementById("registerMessage");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.style.color = "";
        const data = {
          dni: document.getElementById("dni").value.trim(),
          names: document.getElementById("names").value.trim(),
          surnames: document.getElementById("surnames").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
          profile: document.getElementById("profile").value,
          status: document.getElementById("status").value
        };

        if (!/^\d{8}$/.test(data.dni)) return (message.textContent = "El DNI debe tener exactamente 8 dígitos.");
        if (!data.names || !data.surnames) return (message.textContent = "Completa nombres y apellidos.");
        if (!/^[A-Za-z0-9_.]{4,50}$/.test(data.username)) {
          return (message.textContent = "El usuario debe tener de 4 a 50 caracteres (letras, números, punto o guion bajo).");
        }
        if (data.password.length < 8) return (message.textContent = "La clave debe tener al menos 8 caracteres.");

        try {
          await apiRequest("/api/auth/register", { method: "POST", body: data });
          message.style.color = "#1b7a3d";
          message.textContent = "Usuario registrado correctamente.";
          form.reset();
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
