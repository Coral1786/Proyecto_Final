spring.config.import=optional:file:.env[.properties]
spring.application.name=ingearq-local
server.address=127.0.0.1
server.port=${PORT:3000}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=INGEARQSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ingearq2026}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

app.seed-demo-data=${SEED_DEMO_DATA:true}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@ingearq.pe}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Ingearq2024!}
app.demo.seller-email=${DEMO_SELLER_EMAIL:vendedor@ingearq.pe}
app.demo.seller-password=${DEMO_SELLER_PASSWORD:Vendedor2024!}
spring.web.error.include-message=always
